name: CI/CD Pipeline with Google Ping

on:
  push:
    branches:
      - main

jobs:
  # 1. Etapa de Conectividade e Validação (Ping)
  ping-google:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Ping (ICMP)
        run: ping -c 4 google.com

      - name: Executar Requisição HTTP (Curl)
        run: curl -I https://google.com

  # 2. Etapa de Build e Teste (CI) - Só roda se o ping passar
  build-and-test:
    needs: ping-google
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Linter / Build
        run: npm run build --if-present

      - name: Executar Testes
        run: npm test

  # 3. Etapa de Deploy (CD) - Só roda se o Build/Teste passarem
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Chave SSH para o Servidor
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Adicionar Host aos Conhecidos (Known Hosts)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar arquivos via Rsync (Deploy)
        run: |
          rsync -rltgoDzvO --delete ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/sua-app/

      - name: Reiniciar Serviço no Servidor remoto
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd /var/www/sua-app && npm install --production && pm2 restart minha-app"
